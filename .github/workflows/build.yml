name: Build and Release HM Auto-trader

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required only when publishing a release on a tag.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile Fabric mod
        run: gradle clean build --no-daemon
      - name: Collect installable JAR (exclude sources JAR)
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          for jar in build/libs/hm-auto-trader-*.jar; do
            [[ "$jar" == *-sources.jar ]] && continue
            cp "$jar" dist/
          done
          test -n "$(find dist -maxdepth 1 -name '*.jar' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: hm-auto-trader-26.2
          path: dist/*.jar
          if-no-files-found: error
      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          expected_tag="v${version%%+*}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match gradle.properties ($expected_tag)"
            exit 1
          fi
          flags=(--verify-tag --title "HM Auto-trader ${RELEASE_TAG}" --generate-notes)
          if [[ "$RELEASE_TAG" == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/*.jar "${flags[@]}"
