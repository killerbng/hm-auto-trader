name: Build HM Auto-trader (Gitea)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

# This workflow is intentionally build-only; it never creates a release.
# It will run once you have a Gitea Actions runner available with this label.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Compile Fabric mod
        run: gradle clean build --no-daemon
      - name: Collect installable JAR
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob
          for jar in build/libs/hm-auto-trader-*.jar; do
            [[ "$jar" == *-sources.jar ]] && continue
            cp "$jar" dist/
          done
          test -n "$(find dist -maxdepth 1 -name '*.jar' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: hm-auto-trader-26.2
          path: dist/*.jar
          if-no-files-found: error
